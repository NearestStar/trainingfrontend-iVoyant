<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Appointment</title>
</head>
<body>
    <form action="/appointments" method="post">
        <label for="name">Enter Name</label>
        <input type="text" id="name" name="name" minlength="3" maxlength="50" required>

        <label for="email">Enter Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Enter Phone No.</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

        <fieldset>
            <legend>Select Gender</legend>

            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </fieldset>

        <fieldset>
            <legend>
                Select Symptoms
            </legend>

            <input type="checkbox" id="fever" name="symptoms" value="fever">
            <label for="fever">Fever</label>

            <input type="checkbox" id="cough" name="symptoms" value="cough">
            <label for="cough">Cough</label>

            <input type="checkbox" id="cold" name="symptoms" value="cold">
            <label for="cold">Cold</label>
        </fieldset>

        <label for="date">Select date</label>
        <input type="date" id="date" name="date" required>

        <label for="department">Select Department</label>
        <select name="department" id="department" required>
            <option value="">Select Department</option>
            <option value="general">General</option>
            <option value="dermatology">Dermatology</option>
            <option value="cardiology">Cardiology</option>
        </select>

        <label for="msg">Leave Message</label>
        <textarea id="msg" name="msg" minlength="10" maxlength="500" required></textarea>



        <button type="submit">Submit</button>
    </form>
</body>
</html>

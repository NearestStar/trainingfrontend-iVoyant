<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Registration Form</title>
</head>
<body>
    <main>
        <form>
            <label for="full-name">Enter Full Name:</label>
            <input type="text" id="name" name="full-name" placeholder="eg. Austin">

            <label for="email">Enter email:</label>
            <input type="email" id="email" name="email" placeholder="eg. abc@gmail.com">

            <label for="tel">Enter number:</label>
            <input type="tel" id="tel" name="tel" placeholder="eg. 1234567890">

            <label for="age">Enter age:</label>
            <input type="number" id="age" name="age" min="18" max="30" placeholder="eg. 22">

            <label for="dob">Enter date of birth</label>
            <input type="date" id="dob" name="dob" placeholder="eg. 01-01-2004">

            <label for="password">Enter your password</label>
            <input type="password" id="password" name="password" placeholder="minimum 8 characters">

            <fieldset>
                <legend>Gender: </legend>

                <label for="male">Male</label>
                <input type="radio" id="male" name="gender">

                <label for="female">Female</label>
                <input type="radio" id="female" name="gender">

                <label for="others">Others</label>
                <input tyep="radio" id="others" name="others">
                
            </fieldset>
        </form>
    </main>
</body>
</html>
